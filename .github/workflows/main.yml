name: Workflow for DB App

on:
  push:
    branches:
      - main
      - develop

jobs:
  test:
    name: Maven tests and code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Maven tests and generate coverage
        run: mvn -B verify
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          flags: tests
          verbose: true

  build:
    name: Build and run Docker Compose
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Package application
        run: mvn -B package -DskipTests
      - name: Run Docker Compose
        run: docker compose -f docker-compose.yml.yaml up --build --abort-on-container-exit
      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.yml.yaml down
      - name: Create release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.TOKEN }}
          prerelease: false
          automatic_release_tag: latest
          files: ./target/*.jar
