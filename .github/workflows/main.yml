name: Workflow for DB App

on:
  push:
    branches:
      - main
      - develop

jobs:
  test:
    name: Maven tests and code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Maven tests and generate coverage
        run: mvn -B verify
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          flags: tests
          verbose: true

  build:
    name: Build and run Docker Compose
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Package application
        run: mvn -B package -DskipTests
      - name: Run Docker Compose
        run: docker compose -f docker-compose.yml.yaml up --build --abort-on-container-exit
      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.yml.yaml down
      - name: Create release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Latest release
          tag_name: latest
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: target/*.jar
